[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "va-book-bot"
version = "0.3.1"
description = "CLI tooling for Virgin Active Italy class discovery and booking workflows."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  {name = "Alessio Pepe", email = "pepealessio@users.noreply.github.com"},
]
license = {text = "MIT"}
keywords = ["virgin-active", "booking", "cli", "automation"]
dependencies = [
  "httpx>=0.28,<0.29",
  "keyring>=25.0,<26.0",
  "python-dotenv>=1.0,<2.0",
  "python-telegram-bot>=22,<23",
  "questionary>=2.0,<3.0",
]

[project.scripts]
va = "va_cli.cli:main"

[project.urls]
Homepage = "https://github.com/pepealessio/va-booking-bot"
Repository = "https://github.com/pepealessio/va-booking-bot"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
